<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>工单系统适用范围规则</title>
<style>
  /* 主色 PETROL #006878 = CMYK 100/50/50/0 = RAL 5021 Wasserblau = Pantone 315 ｜ 点缀 LIME #AFCA0B */
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body { font-family:"Segoe UI","Microsoft YaHei","微软雅黑",Arial,sans-serif;
         color:#FFFFFF; background:#006878;
         -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .page { position:relative; width:210mm; min-height:297mm; background:#006878;
          display:flex; flex-direction:column; overflow:hidden; }
  .page::before { content:""; position:absolute; top:0; left:0; right:0; height:4mm; background:#AFCA0B; }
  .deco, .deco2 { position:absolute; clip-path:polygon(50% 0, 100% 100%, 0 100%); }
  .deco  { top:14mm;  right:-14mm; width:96mm; height:96mm; background:rgba(255,255,255,.05); }
  .deco2 { top:66mm;  right:16mm;  width:50mm; height:50mm; background:rgba(175,202,11,.10); }
  .deco3 { position:absolute; left:-24mm; bottom:22mm; width:78mm; height:78mm;
           clip-path:polygon(50% 100%, 100% 0, 0 0); background:rgba(255,255,255,.04); }

  .top { padding:15mm 20mm 0; }
  .top svg { height:11mm; width:auto; display:block; }

  main { flex:1; padding:0 20mm; display:flex; flex-direction:column; position:relative; }
  h1 { margin:15mm 0 0; font-size:31pt; font-weight:700; letter-spacing:1px; color:#FFFFFF; }
  .rules { flex:1; display:flex; flex-direction:column; justify-content:center; gap:15mm; }

  .rule { display:flex; align-items:center; gap:10mm; padding:11mm 12mm;
          background:rgba(255,255,255,.06); border-left:4px solid #AFCA0B;
          border-radius:0 2mm 2mm 0; }
  .n { flex:0 0 18mm; height:18mm; border-radius:50%; background:#AFCA0B; color:#00495A;
       font-weight:700; font-size:21pt; text-align:center; line-height:18mm; }
  .bd { flex:1; }
  h2 { margin:0; font-size:18pt; font-weight:700; color:#FFFFFF; line-height:1.35; }
  h2 span { display:block; margin-top:1mm; font-size:12pt; font-weight:400; color:#C7E24B; letter-spacing:.5px; }
  p { margin:3mm 0 0; font-size:12.5pt; line-height:1.55; color:#DCEFF2; }
  .chips { display:flex; flex-wrap:wrap; gap:2.2mm; margin-top:3.5mm; }
  .chip { border:1px solid rgba(255,255,255,.5); border-radius:999px; padding:1.1mm 4.5mm;
          font-size:11pt; color:#FFFFFF; background:rgba(255,255,255,.08); }
  p.ex { margin-top:3.5mm; font-size:11.5pt; color:#C7E24B; }

  footer { background:#00495A; padding:3.5mm 20mm; display:flex; align-items:center; gap:2.5mm;
           color:#BFE0E6; font-size:8pt; letter-spacing:.5px; }
  footer svg { height:4mm; width:auto; display:block; }
</style>
</head>
<body>
<div class="page">
  <div class="deco"></div>
  <div class="deco2"></div>
  <div class="deco3"></div>

  <div class="top">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 634.96 85.04" role="img" aria-label="Lechler">
      <polygon fill="#FFFFFF" points="195.89 70.87 195.89 60.56 154.42 60.56 154.42 14.17 141.73 14.17 141.73 70.87 195.89 70.87"/>
      <polygon fill="#FFFFFF" points="269.09 70.87 269.09 60.56 219.62 60.56 219.62 47.32 264.49 47.32 264.49 37.01 219.62 37.01 219.62 24.48 269.09 24.48 269.09 14.17 206.93 14.17 206.93 70.87 269.09 70.87"/>
      <polygon fill="#FFFFFF" points="362.77 70.87 362.77 47.71 402.73 47.71 402.73 70.87 415.41 70.87 415.41 14.17 402.73 14.17 402.73 37.41 362.77 37.41 362.77 14.17 350.08 14.17 350.08 70.87 362.77 70.87"/>
      <polygon fill="#FFFFFF" points="483.6 70.87 483.6 60.56 442.14 60.56 442.14 14.17 429.45 14.17 429.45 70.87 483.6 70.87"/>
      <polygon fill="#FFFFFF" points="556.81 70.87 556.81 60.56 507.33 60.56 507.33 47.32 552.21 47.32 552.21 37.01 507.33 37.01 507.33 24.48 556.81 24.48 556.81 14.17 494.65 14.17 494.65 70.87 556.81 70.87"/>
      <path fill="#FFFFFF" d="M634.96,32.09c0-6.03-1.63-10.52-4.88-13.48-3.25-2.96-7.81-4.44-13.68-4.44h-47.5v56.69h12.69v-20.85h26.17l12.13,20.85h14.43l-13.08-21.25c4.39-.74,7.77-2.56,10.15-5.47,2.38-2.91,3.57-6.92,3.57-12.05h0ZM622.12,32.09c0,2.75-.62,4.71-1.86,5.87-1.24,1.16-3.03,1.74-5.35,1.74l-33.3-.08v-15.14h33.3c2.33,0,4.11.57,5.35,1.7,1.24,1.14,1.86,3.11,1.86,5.91h0Z"/>
      <path fill="#FFFFFF" d="M290.54,42.52c0-10.04,8.14-18.18,18.18-18.18h0s29.31,0,29.31,0v-10.17h-31.89c-15.65,0-28.35,12.69-28.35,28.35s12.69,28.35,28.35,28.35h31.88v-10.17h-29.31c-10.04,0-18.18-8.14-18.18-18.18h0Z"/>
      <path fill="#AFCA0B" d="M98.19,42.52l-12.27-21.26L73.65,0l-12.27,21.26-12.27,21.26h49.1ZM36.82,21.26L49.1,0h-24.55s-12.27,21.26-12.27,21.26L0,42.52l12.27,21.26,12.27-21.26,12.27-21.26h0ZM36.82,63.78H12.27s12.27,21.26,12.27,21.26h49.1l12.27-21.26h-49.1Z"/>
    </svg>
  </div>

  <main>
    <h1>工单系统适用范围规则</h1>

    <div class="rules">
      <div class="rule">
        <div class="n">1</div>
        <div class="bd">
          <h2>GmbH 开发或维护的系统与平台<span>优先走工单</span></h2>
          <div class="chips">
            <span class="chip">SAP</span><span class="chip">CRM</span><span class="chip">ProFile</span>
            <span class="chip">Cornerstone</span><span class="chip">TankClean</span><span class="chip">Nozzle3</span>
            <span class="chip">GasCool</span><span class="chip">Smart Factory</span><span class="chip">M365</span>
          </div>
          <p class="ex">例外：纯业务问题（使用咨询）不走工单。</p>
        </div>
      </div>

      <div class="rule">
        <div class="n">2</div>
        <div class="bd">
          <h2>LNSC 内部事项<span>无需工单</span></h2>
          <p>OA 新流程开发 · 新账户 / 新设备初始化 · RPA Job 开发 · 打印机故障 · 项目开发</p>
        </div>
      </div>

      <div class="rule">
        <div class="n">3</div>
        <div class="bd">
          <h2>其它问题<span>一律优先走工单</span></h2>
          <p>不属于规则一、二的问题，默认以工单形式发起。</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 98.19 85.04" role="img" aria-label="Lechler">
      <polygon fill="#FFFFFF" points="98.19 42.52 85.92 21.26 73.65 0 61.38 21.26 49.1 42.52 98.19 42.52"/>
      <polygon fill="#AFCA0B" points="36.82 21.26 49.1 0 24.55 0 12.27 21.26 0 42.52 12.27 63.78 24.55 85.04 36.82 63.78 49.1 42.52 36.82 21.26"/>
      <polygon fill="#AFCA0B" points="36.82 63.78 12.27 63.78 24.55 85.04 73.65 85.04 85.92 63.78 36.82 63.78"/>
    </svg>
    <span>Lechler · 内部文件</span>
  </footer>

</div>
</body>
</html>
