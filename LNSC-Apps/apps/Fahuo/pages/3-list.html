<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>清单模式 | LNSC 全链发货平台</title>
<link rel="stylesheet" href="../assets/css/fonts.css?v=20261024a">
<link rel="stylesheet" href="../assets/css/style.css?v=20261024f">
<link rel="icon" type="image/svg+xml" href="../assets/images/lechler-c-logo-symbol-mark-cmyk-00.svg">
<link rel="icon" type="image/png" href="../assets/images/lechler-c-logo-symbol-mark-cmyk-00.png">
</head>
<body>
<div class="layout">

  <!-- 左侧：模式导航 -->
  <aside class="sidebar-left">
    <div class="mode">
      <div class="mode-num">- 1 -</div>
      <a class="mode-btn" href="1-entry.html">录单</a>
    </div>
    <div class="mode">
      <div class="mode-num">- 2 -</div>
      <a class="mode-btn" href="2-order.html">下单</a>
    </div>
    <div class="mode">
      <div class="mode-num">- 3 -</div>
      <a class="mode-btn active" href="3-list.html">清单</a>
    </div>
    <div class="mode">
      <div class="mode-num">- 4 -</div>
      <a class="mode-btn" href="4-sap.html">SAP</a>
    </div>
    <div class="mode">
      <div class="mode-num">- 5 -</div>
      <a class="mode-btn" href="6-label.html">标签</a>
    </div>
    <!-- 追溯页已移除（2026-10-12 用户规则「移除追溯的页面和功能」） -->
  </aside>

  <!-- 中间：清单模式 -->
  <main class="main lm-page">
    <header class="title-bar">
      <!-- 左段：LECHLER 组合标志（白底，按源文件品牌色显示；2026-10-08 用户指定） -->
      <div class="tb-logo-box"><img class="tb-logo" src="../assets/images/lechler-c-logo-combination-mark-cmyk-00.svg" alt="LECHLER"></div>
      <!-- 中段：中文名 + 英文名同处一段（主题色斜切段，白色字，同一行并排） -->
      <div class="tb-mid">
        <h1>LNSC 全链发货平台</h1>
        <span class="tb-sub">LNSC FULL-CHAIN DELIVERY SYSTEM</span>
      </div>
      <div class="title-right">
        <span class="tb-brand">Logistics</span>
        <span class="tb-clock"><b id="tbTime">--:--:--</b><i id="tbDate">----/--/--</i></span>
        <button class="btn icon-btn" type="button" title="警告" aria-label="警告"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
        <span class="api-dot" id="apiDot" title="API 状态检测中…"></span>
        <!-- 右上标签图标按钮已撤（2026-10-12 用户规则：入口终定=左侧导航「标签」块） -->
        <button class="btn icon-btn" type="button" title="设置" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <button class="btn icon-btn" type="button" title="HELP/操作说明" aria-label="HELP/操作说明" onclick="location.href='7-help.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
        <button class="btn icon-btn" type="button" title="关于" aria-label="关于"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button>
      </div>
    </header>

    <div class="lm-main">

      <!-- 上部：类型过滤 + 优先级过滤 + 搜索框 -->
      <div class="lm-search">
        <div class="prio-btns lm-type">
          <button class="btn lm-add-waybill" id="btnManualWaybill" type="button"
                  title="手工补录系统外运单（支持模糊搜索和批量添加）" aria-label="手工补录系统外运单">＋</button>
          <button class="btn otype" type="button" data-t="发货单">发货单</button>
          <button class="btn otype" type="button" data-t="外协单">外协单</button>
          <button class="btn otype" type="button" data-t="其他">其他</button>
        </div>
        <!-- 优先级筛选组移除（2026-09-20 用户规则：优先级分类只留在录单页；紧急行整行加粗红字） -->
        <div class="lm-search-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="lmSearch" type="search" autocomplete="off" aria-label="搜索当前清单"
                 placeholder="搜索 DN / 地址 / 姓名 / 电话 / 备注 / 承运商 / 单号 / 状态…">
        </div>
        <span class="lm-count" id="lmCount"></span>
        <!-- 分享四件套（照搬 PO-Closing：复制/邮件/Teams/导出；2026-09-16 用户要求） -->
        <div class="lm-share">
          <button class="btn" id="btnLmCopy" title="复制：把当前筛选的行复制到剪贴板"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="8" height="9" rx="1"/><path d="M3.5 11V3.5a1 1 0 0 1 1-1H11"/></svg></button>
          <button class="btn" id="btnLmMail" title="邮件：调起本机 Outlook，附上当前筛选的行"><svg viewBox="0 0 16 16" fill="none" stroke="#0F6CBD" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.6" y="3.4" width="12.8" height="9.2" rx="1.2"/><path d="M2.4 4.6 8 9.2l5.6-4.6"/></svg></button>
          <button class="btn" id="btnLmTeams" title="Teams：复制消息并打开 Teams，粘贴到会话发送"><svg viewBox="0 0 16 16"><rect x="1" y="2.5" width="10.5" height="10.5" rx="1.8" fill="#4F5BA9"/><text x="6.2" y="10.6" font-size="7" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif">T</text><circle cx="13" cy="5.6" r="1.9" fill="#7C85C0"/><path d="M10.8 13.5v-3.2c0-.9.9-1.5 2.2-1.5s2.2.6 2.2 1.5v3.2z" fill="#7C85C0"/></svg></button>
          <button class="btn" id="btnLmExport" title="导出当前筛选的行为 Excel"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v7M5 7l3 3 3-3M2.5 12.5v1.5a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-1.5"/></svg></button>
        </div>
      </div>

      <!-- 整合清单：录单列 + 下单列 -->
      <section class="lm-list table-wrap">
        <div class="header-wrap">
          <table class="order-table">
            <colgroup>
              <col class="col3-dn"><col class="col3-so"><col class="col3-prio"><col class="col3-addr"><col class="col3-name">
              <col class="col3-waybill"><col class="col3-st"><col class="col3-st">
              <col class="col3-photo"><col class="col3-note">
            </colgroup>
            <thead>
              <tr><th>DN</th><th>SO</th><th></th><th>地址</th><th>姓名</th>
                  <th>单号</th><th>下单状态</th><th>路由状态</th><th></th><th>备注</th></tr>
            </thead>
          </table>
        </div>
        <div class="table-section">
          <table class="order-table">
            <colgroup>
              <col class="col3-dn"><col class="col3-so"><col class="col3-prio"><col class="col3-addr"><col class="col3-name">
              <col class="col3-waybill"><col class="col3-st"><col class="col3-st">
              <col class="col3-photo"><col class="col3-note">
            </colgroup>
            <tbody id="listBody"></tbody>
          </table>
        </div>
      </section>

    </div>
  </main>

  <!-- 右侧：发货统计 -->
  <aside class="sidebar-right">
    <div class="stat">
      <div class="stat-label">昨日发货</div>
      <div class="stat-value">00</div>
    </div>
    <div class="stat">
      <div class="stat-label">今日待发货</div>
      <div class="stat-value">00</div>
    </div>
    <div class="stat">
      <div class="stat-label">超时未发货</div>
      <div class="stat-value">00</div>
    </div>
    <div class="stat">
      <div class="stat-label">计划发货</div>
      <div class="stat-value">00</div>
    </div>
    <div class="stat">
      <div class="stat-label">今日回单</div>
      <div class="stat-value">00</div>
    </div>
  </aside>

</div>
<!-- 运单步骤弹窗：点击单号打开（与下单页同款）；第一步固定为下单返回值，其后为承运商轨迹节点 -->
<div class="steps-mask" id="stepsMask" hidden>
  <div class="steps-modal">
    <div class="steps-head">
      <b id="stepsTitle">运单跟踪</b>
      <button class="steps-close" id="stepsClose" type="button" title="关闭">×</button>
    </div>
    <div class="steps-body" id="stepsBody"></div>
  </div>
</div>

<!-- 系统外运单手工补录：模糊搜索、多选后逐单填写，批量事务保存 -->
<div class="steps-mask" id="manualWaybillMask" hidden>
  <div class="steps-modal mw-modal" role="dialog" aria-modal="true" aria-labelledby="manualWaybillTitle">
    <div class="steps-head">
      <b id="manualWaybillTitle">手工补录系统外运单</b>
      <button class="steps-close" id="manualWaybillClose" type="button" title="关闭" aria-label="关闭">×</button>
    </div>
    <div class="mw-body">
      <p class="mw-tip">只维护系统外已产生的运单，不调用承运商下单。已有运单的订单不会出现在候选中；批量保存时任意一条失败，整批均不写入。</p>
      <div class="mw-defaults">
        <label class="mw-field">默认承运商
          <input id="mwDefaultCarrier" list="mwCarrierOptions" maxlength="30" value="顺丰" autocomplete="off">
        </label>
        <datalist id="mwCarrierOptions">
          <option value="顺丰"></option><option value="德邦"></option><option value="跨越"></option>
          <option value="京东"></option><option value="中通"></option><option value="圆通"></option>
          <option value="韵达"></option><option value="申通"></option><option value="EMS"></option>
        </datalist>
        <label class="mw-field">默认路由状态
          <select id="mwDefaultRouteStatus">
            <option>待揽收</option><option>已揽收</option><option>运送中</option>
            <option>派送中</option><option>已签收</option><option>已送达</option>
          </select>
        </label>
        <button class="btn" id="mwApplyDefaults" type="button">应用到全部已选</button>
      </div>
      <div class="mw-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="mwSearch" type="search" autocomplete="off" aria-label="模糊搜索可补录订单"
               placeholder="模糊搜索 DN / SO / 姓名 / 电话 / 地址 / 负责人 / 备注…">
      </div>
      <div class="mw-panes">
        <section class="mw-pane">
          <div class="mw-pane-title" id="mwResultTitle">可补录订单（点击添加，可多选）</div>
          <div class="mw-results" id="mwResults"></div>
        </section>
        <section class="mw-pane">
          <div class="mw-pane-title" id="mwSelectedTitle">已选 0 单（逐单填写运单信息）</div>
          <div class="mw-entries" id="mwEntries"></div>
        </section>
      </div>
      <div class="mw-message" id="mwMessage" role="status" aria-live="polite"></div>
    </div>
    <div class="mw-foot">
      <button class="btn" id="mwCancel" type="button">取消</button>
      <button class="btn primary" id="mwSave" type="button" disabled>批量保存</button>
    </div>
  </div>
</div>

<script src="../assets/js/stats.js"></script>
<script src="../assets/js/topbar.js"></script>
<script src="../assets/vendor/docx-preview.min.js"></script>
<script src="../assets/vendor/xlsx.full.min.js"></script>
<script src="../assets/js/note-copy.js?v=20261024a"></script>
<script src="../assets/js/pages/3-list.js?v=20261024b"></script>
</body>
</html>
