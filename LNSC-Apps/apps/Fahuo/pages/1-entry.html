<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LNSC 全链发货平台 | LNSC Full-Chain Delivery System</title>
<link rel="stylesheet" href="../shared/style.css">
<link rel="icon" href="../shared/App.ico">
</head>
<body>
<div class="layout">

  <!-- 左侧：模式导航 -->
  <aside class="sidebar-left">
    <div class="mode">
      <div class="mode-num">- 1 -</div>
      <a class="mode-btn active" href="1-entry.html">录单</a>
    </div>
    <div class="mode">
      <div class="mode-num">- 2 -</div>
      <a class="mode-btn" href="2-order.html">下单</a>
    </div>
    <div class="mode">
      <div class="mode-num">- 3 -</div>
      <a class="mode-btn" href="3-list.html">清单</a>
    </div>
    <div class="mode">
      <div class="mode-num">- 4 -</div>
      <a class="mode-btn" href="4-sap.html">SAP</a>
    </div>
    <div class="mode">
      <div class="mode-num">- 5 -</div>
      <a class="mode-btn" href="5-trace.html">追溯</a>
    </div>
  </aside>

  <!-- 中间：主内容 -->
  <main class="main">

    <!-- 标题栏 -->
    <header class="title-bar">
      <h1>LNSC 全链发货平台</h1>
      <span class="tb-mid">LNSC Full-Chain Delivery System</span>
      <div class="title-right">
        <span class="tb-brand">Logistics</span>
        <span class="tb-clock"><b id="tbTime">--:--:--</b><i id="tbDate">----/--/--</i></span>
        <button class="btn icon-btn" type="button" title="警告" aria-label="警告"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
        <span class="api-dot" id="apiDot" title="API 状态检测中…"></span>
        <button class="btn icon-btn" type="button" title="设置" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <button class="btn icon-btn" type="button" title="关于" aria-label="关于"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button>
      </div>
    </header>

    <!-- 录单区：识别 + 解析确认 -->
    <section class="entry-row">

      <!-- 左面板：地址粘贴识别（支持文字 / 图片） -->
      <div class="panel paste-panel">
        <div class="paste-search">
          <input id="poolSearch" class="paste-search-input" type="text" placeholder="搜索常用地址" autocomplete="off">
          <div class="paste-search-list" id="poolSearchList" hidden></div>
        </div>
        <textarea id="pasteInput" class="paste-input" placeholder="请把地址粘贴到此处，文本、图片都可以&#10;截图 Ctrl+V / 拖拽 / 点图片按钮加载&#10;点击识别"></textarea>
        <div class="panel-actions">
          <input type="file" id="fileInput" accept="image/*" hidden>
          <button id="btnImage" class="btn" type="button">添加图片</button>
          <button id="btnRecognize" class="btn" type="button">识别</button>
        </div>
      </div>

      <!-- 中面板：解析结果确认（承运商底部右下） -->
      <div class="panel parse-panel">
        <div class="region-row">
          <select id="selProvince" class="select-btn"><option value="">省</option></select>
          <select id="selCity" class="select-btn"><option value="">市</option></select>
          <select id="selDistrict" class="select-btn"><option value="">区</option></select>
        </div>
        <!-- 街道/公司拆两字段（2026-09-17 用户规则）：公司独立入库并下发承运商（面单收件公司）；
             两字段一行均分整行（sc-row 两列，同用户规则） -->
        <div class="street-row sc-row">
          <input id="streetInput" class="street-input" type="text" placeholder="街道">
          <input id="companyInput" class="street-input" type="text" placeholder="公司">
        </div>
        <div class="contact-row">
          <input id="nameInput" class="line-input" type="text" placeholder="姓名">
          <input id="phoneInput" class="line-input" type="text" placeholder="联系方式">
          <span class="date-label">选择发货日期</span>
          <input id="dateInput" class="line-input date-input" type="date">
        </div>
        <!-- 备注在姓名下面（2026-09-17 用户规则） -->
        <div class="street-row note-row">
          <input id="noteInput" class="street-input" type="text" placeholder="备注">
        </div>
        <div class="pool-row">
          <label class="pool-label" for="poolCheck">勾选表示将地址信息存到常用地址池里</label>
          <input type="checkbox" id="poolCheck" class="pool-check">
        </div>
      </div>

      <!-- 右列：下单类型 + SO/DN盒 + 上传文件 -->
      <div class="type-panel">
        <div class="type-btns">
          <button class="btn otype active" type="button" data-t="发货单">发货单</button>
          <button class="btn otype" type="button" data-t="外协单">外协单</button>
          <button class="btn otype" type="button" data-t="其他">其他</button>
        </div>
        <div class="type-box">
          <!-- 发货单：DN 必填（上一行）+ SO 选填（下一行）（用户规则 2026-09-15） -->
          <div class="type-mode" id="modeShip">
            <div class="type-dn-row">
              <label class="fld"><span>DN *</span><input id="soInput" class="line-input" type="text" inputmode="numeric" maxlength="10"></label>
              <label class="fld"><span>SO</span><input id="soNoInput" class="line-input" type="text" inputmode="numeric" maxlength="10"></label>
            </div>
          </div>
          <!-- 外协单：PO + 采购员 + 公司电话 -->
          <div class="type-mode" id="modeOut" hidden>
            <label class="fld"><span>PO *</span><input id="poInput" class="line-input" type="text" inputmode="numeric"></label>
            <label class="fld"><span>采购员 *</span><input id="buyerInput" class="line-input" type="text"></label>
            <div class="buyer-phone"><span>公司电话</span><b>0519 6822-8088</b></div>
          </div>
          <!-- 其他：员工快递（员工姓名 + 电话） -->
          <div class="type-mode" id="modeOther" hidden>
            <label class="fld"><span>员工姓名 *</span><input id="empNameInput" class="line-input" type="text"></label>
            <label class="fld"><span>员工电话 *</span><input id="empPhoneInput" class="line-input" type="text" inputmode="numeric" maxlength="11"></label>
          </div>
          <input type="file" id="upFileInput" hidden multiple>
          <button id="btnUpload" class="btn upload-btn" type="button">上传文件</button>
          <span id="upFileName" class="up-file"></span>
        </div>
        <div class="prio-btns type-prio">
          <button class="btn prio" type="button" data-p="紧急">紧急</button>
          <button class="btn prio" type="button" data-p="重要">重要</button>
          <button class="btn prio active" type="button" data-p="一般">一般</button>
        </div>
      </div>

      <!-- 独立列：承运商（竖排五枚，均分通高） -->
      <div class="carrier-col">
        <button class="btn carrier" type="button" data-carrier="顺丰">顺丰</button>
        <button class="btn carrier" type="button" data-carrier="德邦">德邦</button>
        <button class="btn carrier" type="button" data-carrier="跨越">跨越</button>
        <button class="btn carrier" type="button" data-carrier="专车">专车</button>
        <button class="btn carrier" type="button" data-carrier="自提">自提</button>
      </div>

      <!-- 独立列：确定 -->
      <button id="btnConfirm" class="btn confirm-btn" type="button">确定</button>

    </section>

    <!-- 发货清单表（表头固定不滚动，数据区独立滚动） -->
    <section class="table-wrap">
      <div class="header-wrap">
        <table class="order-table">
          <colgroup>
            <col class="col-so"><col class="col-so-no"><col class="col-prio"><col class="col-addr"><col class="col-name">
            <col class="col-note"><col class="col-carrier">
            <col class="col-date"><col class="col-del">
          </colgroup>
          <thead>
            <tr>
              <th class="col-so">DN</th>
              <th class="col-so-no">SO</th>
              <th class="col-prio"></th><!-- 优先级/类型合并列（无标题，两行显示，同清单） -->
              <th class="col-addr">地址</th>
              <th class="col-name">姓名</th>
              <th class="col-note">备注</th>
              <th class="col-carrier">承运商</th>
              <th class="col-date">要求发货日期</th>
              <th class="col-del"></th><!-- 删除列（无标题，未下单行显示删除按钮） -->
            </tr>
          </thead>
        </table>
      </div>
      <div class="table-section">
        <table class="order-table">
          <colgroup>
            <col class="col-so"><col class="col-so-no"><col class="col-prio"><col class="col-addr"><col class="col-name">
            <col class="col-note"><col class="col-carrier">
            <col class="col-date"><col class="col-del">
          </colgroup>
          <tbody id="orderBody">
            <!-- 数据行由 script.js 动态填充 -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- 右侧：发货统计 -->
  <aside class="sidebar-right">
    <div class="stat">
      <div class="stat-label">昨日发货</div>
      <div class="stat-value">00</div>
    </div>
    <div class="stat">
      <div class="stat-label">今日待发货</div>
      <div class="stat-value">00</div>
    </div>
    <div class="stat">
      <div class="stat-label">超时未发货</div>
      <div class="stat-value">00</div>
    </div>
    <div class="stat">
      <div class="stat-label">计划发货</div>
      <div class="stat-value">00</div>
    </div>
    <div class="stat">
      <div class="stat-label">今日回单</div>
      <div class="stat-value">00</div>
    </div>
  </aside>

</div>
<script src="../shared/lib/tesseract.min.js"></script>
<script src="../shared/region.js"></script>
<script src="../shared/topbar.js"></script>
<script src="1-entry.js"></script>
</body>
</html>
