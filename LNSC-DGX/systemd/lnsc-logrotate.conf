# /etc/logrotate.d/lnsc  —— LNSC-DGX 日志轮转（防止"留日志"变成"吃满磁盘"）
#
# 安装（可逆）:
#   sudo cp systemd/lnsc-logrotate.conf /etc/logrotate.d/lnsc
#   sudo logrotate -d /etc/logrotate.d/lnsc      # 先 dry-run 检查
#   # 回滚: sudo rm /etc/logrotate.d/lnsc

/var/log/lnsc/*.log /var/log/lnsc/metrics.csv {
    weekly
    rotate 12
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0640 root root
}